services:
  postgres:
    image: postgres:18
    container_name: connect-drive-postgres
    environment:
      POSTGRES_DB: connectdrive
      POSTGRES_USER: connectdrive
      POSTGRES_PASSWORD: connectdrive
    ports:
      - "5433:5432"
    volumes:
      - connect-drive-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connectdrive -d connectdrive"]
      interval: 10s
      timeout: 5s
      retries: 5


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: connect-drive-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: connectdrive@connectdrive.com
      PGADMIN_DEFAULT_PASSWORD: connectdrive
    ports:
      - "5050:80"
    volumes:
      - connect-drive-pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro


  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connect-drive-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/connectdrive
      SPRING_DATASOURCE_USERNAME: connectdrive
      SPRING_DATASOURCE_PASSWORD: connectdrive
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "true"
    ports:
      - "8080:8080"


volumes:
  connect-drive-postgres-data:
  connect-drive-pgadmin-data:
