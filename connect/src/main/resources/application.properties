spring.application.name=connect-drive


# Configurações de conexão do Banco de Dados
spring.datasource.url=jdbc:postgresql://localhost:5432/connectdrive
spring.datasource.username=connectdrive
spring.datasource.password=connectdrive
spring.datasource.driver-class-name=org.postgresql.Driver0

# JPA / Hibernate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

# Console H2
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

