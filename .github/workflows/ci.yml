
  name: CI

  on:
    push:
      branches:
        - development

    pull_request:
      branches:
        - main
        - development

  concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

  permissions:
    contents: read
    pull-requests: write

  jobs:
    build:
      name: Build e Testes
      runs-on: ubuntu-latest
      timeout-minutes: 15

      steps:
        - name: Checkout do código
          uses: actions/checkout@v4

        - name: Configurar JDK 26
          uses: actions/setup-java@v4
          with:
            java-version: '26'
            distribution: 'temurin'
            cache: 'maven'
            cache-dependency-path: connect/pom.xml

        - name: Compilar e rodar testes
          working-directory: connect
          run: ./mvnw -B verify 2>&1 | tee build.log

        - name: Gerar pacote (jar)
          working-directory: connect
          run: ./mvnw -B package -DskipTests 2>&1 | tee -a build.log

        - name: Upload do artefato gerado
          uses: actions/upload-artifact@v4
          with:
            name: connect-drive-build
            path: connect/target/*.jar
            retention-days: 7