name: CI

on:
  pull_request:
    branches:
      - main
      - development

# Cancela execuções antigas do mesmo PR quando um novo push chega,
# evitando gastar minutos de CI com um código já desatualizado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Permissão mínima necessária: leitura do código + escrita de comentários no PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build e Testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar e rodar testes
        run: mvn -B verify 2>&1 | tee build.log

      - name: Gerar pacote (jar)
        run: mvn -B package -DskipTests 2>&1 | tee -a build.log

      - name: Upload do artefato gerado
        uses: actions/upload-artifact@v4
        with:
          name: connect-drive-build
          path: '**/target/*.jar'
          retention-days: 7

      - name: Comentar erro no Pull Request (em caso de falha)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let logContent = '';
            try {
              logContent = fs.readFileSync('build.log', 'utf8');
            } catch (e) {
              logContent = 'Não foi possível ler o log de build.';
            }

            // Pega só as últimas ~60 linhas para não estourar o limite de comentário
            const lines = logContent.split('\n');
            const tail = lines.slice(-60).join('\n');

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '### ❌ O pipeline de CI falhou',
              '',
              `**Workflow:** \`${context.workflow}\``,
              `**Run completo:** ${runUrl}`,
              '',
              '<details><summary>Últimas linhas do log</summary>',
              '',
              '```',
              tail,
              '```',
              '',
              '</details>'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });